<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
<style>
    td{
        border: 1px solid black;
        width: 400px;
        height: 100px;
    }
    
    td:hover{
        background-color: yellow;
    }

    tr.linha01{
        background-color: blue;
        vertical-align: top;
    }
    
    table{
        border-collapse: collapse;
        margin: 60px auto auto auto;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        }

    h1{
        text-align: center;
    }
</style>

</head>

<body>
    <h1>Minha Primeira Tabela</h1>
    <table>
        <tr class="linha01">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </table>

</body>

</html>
