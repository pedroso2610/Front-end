<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento de imagens de fundo</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        body{
            height: 100vh;
        }

        div#q1{
            background-image: url(imagens/wallpaper003.jpg);
            height: 200px;
            width: 100%;
            background-repeat: no-repeat;
            background-position: left top;   
        }

        
        div#q2{
            
            background-image: url(imagens/wallpaper003.jpg);
            height: 200px;
            width: 100%;
            background-repeat: no-repeat;
            background-position: center center;   
        }

        div#q3{
            background-image: url(imagens/wallpaper003.jpg);
            height: 200px;
            width: 100%;
            background-repeat: no-repeat;
            background-position: right top;   
        }
    </style>
</head>

<body>
    <div id="q1">

    </div>

    <div id="q2">

    </div>

    <div id="q3">

    </div>
</body>

</html>
